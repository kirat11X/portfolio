# Render Blueprint: a free static site (pure client-side rendering, no server).
services:
  - type: web
    name: kritansh-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      # Single-page app: every route is rendered in the browser from index.html.
      - type: rewrite
        source: /*
        destination: /index.html
